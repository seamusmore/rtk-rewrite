name: Compatibility tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Hermes regression and Codex hook contract
        run: python -m unittest discover -s tests -v
